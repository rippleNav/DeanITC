<title>RippleNav — Thought-Responsive Instrument</title>
<style>
  :root {
    --bg: #0a0a0c;
    --surface: #111118;
    --border: #1a1a2e;
    --text: #c8c8d0;
    --text-dim: #9090a0;
    --accent: #6ed5ff;
    --accent2: #c9abff;
    --accent-glow: rgba(51, 204, 136, 0.3);
    --warn: #cc9933;
    --warn-glow: rgba(204, 153, 51, 0.3);
    --heading: #e0e0e8;
    --grid: rgba(51, 204, 136, 0.06);
    --font-mono: 'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
    --font-body: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Oscilloscope Area ── */
  #scope-container {
    position: sticky;
    top: 0;
    z-index: 100;
    background: #020205;
    border-bottom: 1px solid var(--border);
    padding: 0;
  }

  /* ── Controls bar below the stripe ── */
  #controls-bar {
    display: flex;
    align-items: center;
    gap: 24px;
    padding: 6px 16px;
    background: var(--surface);
    border-top: 1px solid var(--border);
  }
  .ctrl-group {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 1;
    min-width: 0;
  }
  .ctrl-label {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .ctrl-val {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--accent);
    min-width: 44px;
    text-align: right;
    white-space: nowrap;
  }

  /* ── Range sliders ── */
  .ctrl-group input[type=range] {
    flex: 1;
    -webkit-appearance: none;
    appearance: none;
    height: 2px;
    background: #2a2a3a;
    border-radius: 1px;
    outline: none;
    min-width: 30px;
  }
  .ctrl-group input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    box-shadow: 0 0 6px var(--accent-glow);
  }
  .ctrl-group input[type=range]::-moz-range-thumb {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    border: none;
    box-shadow: 0 0 6px var(--accent-glow);
  }

  /* ── Layout ── */
  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 2rem 1.5rem 6rem;
  }

  /* ── Elevator Pitch ── */
  .pitch {
    text-align: center;
    padding: 2rem 0 3rem;
    border-bottom: 1px solid var(--border);
    margin-bottom: 3rem;
  }
  .pitch h1 {
    font-size: 1.8rem;
    font-weight: 600;
    color: var(--heading);
    margin-bottom: 0.75rem;
  }
  .pitch p {
    color: var(--text-dim);
    font-size: 1.05rem;
    max-width: 560px;
    margin: 0 auto;
  }
  .pitch .commitment {
    display: inline-block;
    margin-top: 1.25rem;
    padding: 0.5rem 1.2rem;
    border: 1px solid var(--warn);
    border-radius: 4px;
    color: var(--warn);
    font-size: 0.85rem;
    font-weight: 500;
    background: var(--warn-glow);
  }

  /* ── Phase Headers ── */
  .phase-marker {
    font-family: var(--font-mono);
    font-size: 0.9rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 0.3rem;
    opacity: 0.9;

    font-weight: 600;
  }

  h2 {
    font-size: 1.4rem;
    font-weight: 600;
    color: var(--heading);
    margin-bottom: 1.25rem;
  }
  h3 {
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--heading);
    margin: 2rem 0 0.75rem;
  }
  h4 {
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--heading);
    margin: 1.5rem 0 0.5rem;
  }

  p { margin-bottom: 1rem; color: var(--text); }
  p.dim { color: var(--text-dim); font-size: 0.9rem; }

  /* ── Safety / Warning Box ── */
  .safety {
    background: #1a1508;
    border-left: 3px solid var(--warn);
    padding: 1rem 1.25rem;
    margin: 1.5rem 0;
    border-radius: 0 6px 6px 0;
    font-size: 0.92rem;
  }
  .safety strong {
    color: var(--warn);
    display: block;
    margin-bottom: 0.3rem;
  }

  /* ── Exercise Box ── */
  .exercise {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1.25rem 1.5rem;
    margin: 1.5rem 0;
  }
  .exercise h4 {
    margin-top: 0;
    color: var(--accent);
    font-family: var(--font-mono);
    font-size: 0.8rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .exercise ol, .exercise ul {
    margin-left: 1.25rem;
    margin-bottom: 0.5rem;
  }
  .exercise li {
    margin-bottom: 0.4rem;
  }
  .exercise .note {
    font-size: 0.85rem;
    color: var(--text-dim);
    margin-top: 0.75rem;
    font-style: italic;
  }

  /* ── Key Number Highlight ── */
  .keynum {
    color: var(--accent);
    font-weight: 600;
  }

  /* ── Divider ── */
  .phase-divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 3rem 0;
  }

  /* ── Responsive ── */
  @media (max-width: 600px) {
    main { padding: 1rem 1rem 4rem; }
    #sine-stripe { height: 100px; }
    #controls-bar {
      flex-wrap: wrap;
      gap: 8px;
      padding: 6px 10px;
    }
    .pitch h1 { font-size: 1.4rem; }
  }
</style>
</head>
<body>

<!-- ═══════════════════════════════════════════════════════════════════ -->
<!-- OSCILLOSCOPE AREA — moving sine wave + controls                -->
<!-- ═══════════════════════════════════════════════════════════════════ -->
<div id="scope-container">
  <div id="sine-stripe">
    <div class="water-layer-c"></div>
  </div>

  <div id="controls-bar">
    <div class="ctrl-group">
      <span class="ctrl-label">Gain</span>
      <input type="range" id="ampSlider" min="0" max="50" value="15" step="0.1">
      <span class="ctrl-val" id="gainDisplay">15.0</span>
    </div>
    <!--
    <div class="ctrl-group">
      <span class="ctrl-label">LPF α</span>
      <input type="range" id="lpfSlider" min="0" max="100" value="23" step="1">
      <span class="ctrl-val" id="lpfDisplay">0.482</span>
    </div>
    <div class="ctrl-group">
      <span class="ctrl-label">Inertia</span>
      <input type="range" id="smoothSlider" min="0" max="100" value="14" step="1">
      <span class="ctrl-val" id="smoothDisplay">84.2%</span>
    </div>
    -->
  </div>
</div>


<script>
'use strict';

// ════════════════════════════════════════════════════════════
//  SINE-WAVE STRIPE,  compositor-animated background
// ════════════════════════════════════════════════════════════
const _stripeEl    = document.getElementById('sine-stripe');
const TILE_W       = 160;   // px,  one sine cycle width (unused, kept for reference)
const STRIPE_SCALE = 180;   // orbVelocity → px/tick

// ── Water crossfade parameters (tweak these) ───────────────
//     Located ~line 905 in the <script> block
const CROSSFADE_HZ     = 1.3;   // Hz,  ripple frequency (pool surface ≈ 1.0–2.5)
const CROSSFADE_HSHIFT = 0.15;  // fraction of TILE_W,  horizontal offset for layer B
const CROSSFADE_VSHIFT = 0.15;  // fraction of bar height,  vertical offset for layer C

let   stripeOffset = 0;     // accumulates freely; repeat-x handles tiling
let   crossfadeTime = 0;    // seconds,  drives crossfade oscillation

function _buildStripeDataURI() {
  _stripeEl.style.backgroundImage = 'url(water2.png)';
}
//_buildStripeDataURI();

// Set crossfade pixel shifts from the fraction constants
_stripeEl.style.setProperty('--crossfade-shift-px',
  Math.round(TILE_W * CROSSFADE_HSHIFT) + 'px');
_stripeEl.style.setProperty('--crossfade-vshift-px',
  Math.round(160 * CROSSFADE_VSHIFT) + 'px');

function stepStripe(vel) {
  stripeOffset += vel * STRIPE_SCALE;
  // No modulo,  background-repeat: repeat-x handles infinite scrolling.
  // A modulo at a non-tile boundary causes visible jumps.
}

function rebuildStripeTile() { _buildStripeDataURI(); }

// ════════════════════════════════════════════════════════════
//  DUAL ENGINE (Mode C only)
// ════════════════════════════════════════════════════════════
function mulberry32(seed) {
  let s = seed >>> 0;
  return () => {
    s += 0x6D2B79F5;
    let z = s;
    z = Math.imul(z ^ (z >>> 15), z | 1);
    z ^= z + Math.imul(z ^ (z >>> 7), z | 61);
    return ((z ^ (z >>> 14)) >>> 0) / 4294967296;
  };
}

const rngA = mulberry32(0xDEADBEEF);
const rngB = mulberry32(0xC0FFEE42);

function batchStats(rng, n) {
  let sum = 0, sq = 0;
  for (let i = 0; i < n; i++) { const v = rng(); sum += v; sq += v * v; }
  const mean = sum / n;
  return { mean, variance: sq / n - mean * mean };
}

function senseDual() {
  const { mean: mA } = batchStats(rngA, currentBatch);
  const { mean: mB } = batchStats(rngB, currentBatch);
  return mA - mB;
}

// ════════════════════════════════════════════════════════════
//  SLIDER MATH
// ════════════════════════════════════════════════════════════
function sliderToAmp(v)   { return +v; }
function sliderToAlpha(v) { return Math.pow(10, (+v - 100) * 3 / 100); }
function sliderToLerp(v)  { return Math.pow(10, -v * 3 / 100); }

// ════════════════════════════════════════════════════════════
//  DOM REFS
// ════════════════════════════════════════════════════════════
const ampSlider       = document.getElementById('ampSlider');
var lpfSlider = {}, smoothSlider = {};
lpfSlider.value       = 33;//document.getElementById('lpfSlider'); //23
smoothSlider.value    = 14;//document.getElementById('smoothSlider'); //14
const gainDisplay     = document.getElementById('gainDisplay');
//const lpfDisplay      = document.getElementById('lpfDisplay');
//const smoothDisplay   = document.getElementById('smoothDisplay');

function updateDisplays() {
  gainDisplay.textContent   = parseFloat(ampSlider.value).toFixed(1);
  //const a = sliderToAlpha(+lpfSlider.value);
  //lpfDisplay.textContent    = a >= 0.995 ? 'off' : a.toFixed(3);
  //smoothDisplay.textContent = ((1 - sliderToLerp(+smoothSlider.value)) * 100).toFixed(1) + '%';
}

// ════════════════════════════════════════════════════════════
//  STATE
// ════════════════════════════════════════════════════════════
let currentBatch = 2046; //4096;
let lpfState     = 0;
let orbPos       = 0;
let orbVelocity  = 0;
let tick         = 0;

// ════════════════════════════════════════════════════════════
//  MAIN LOOP,  frame-locked via requestAnimationFrame
// ════════════════════════════════════════════════════════════
const TICK_MS = 16;
let lastTime = performance.now();
let accumulator = 0;

function tickLoop(time) {
  time = time || performance.now();
  let deltaTime = time - lastTime;
  lastTime = time;

  if (deltaTime > 250) deltaTime = 250;

  accumulator += deltaTime;

  while (accumulator >= TICK_MS) {
    const raw = senseDual();

    lpfState    += sliderToAlpha(+lpfSlider.value) * (raw - lpfState);
    const targetV = -lpfState * sliderToAmp(+ampSlider.value) * 1.5;
    orbVelocity += (targetV - orbVelocity) * sliderToLerp(+smoothSlider.value);

    orbPos += orbVelocity;

    if (orbPos >=  1) orbPos =  1;
    if (orbPos <= -1) orbPos = -1;

    stepStripe(orbVelocity);

    // 3-phase water-layer crossfade (phases 0°, 120°, 240°)
    crossfadeTime += TICK_MS / 1000;
    const θ  = crossfadeTime * Math.PI * 2 * CROSSFADE_HZ;
    const pB = (Math.sin(θ)               + 1) / 2;  // layer B,  horiz offset
    const pC = (Math.sin(θ + 2.094)       + 1) / 2;  // layer C,  vert  offset (120°)
    // Layer A is the base background,  always fully visible.
    // Layers B and C oscillate on top, creating a 3-way shimmer.
    _stripeEl.style.setProperty('--crossfade-opacity-b', pB);
    _stripeEl.style.setProperty('--crossfade-opacity-c', pC);

    tick++;

    accumulator -= TICK_MS;
  }

  _stripeEl.style.backgroundPositionX = -stripeOffset + 'px';
  _stripeEl.style.setProperty('--stripe-pos', -stripeOffset + 'px');
  requestAnimationFrame(tickLoop);
}

// ════════════════════════════════════════════════════════════
//  EVENT LISTENERS
// ════════════════════════════════════════════════════════════
ampSlider.addEventListener('input',    updateDisplays);
//lpfSlider.addEventListener('input',    updateDisplays);
//smoothSlider.addEventListener('input', updateDisplays);

updateDisplays();
requestAnimationFrame(tickLoop);
</script>

</body>
</html>
